# .sdda/capability-matrix.yml — Matrice harnais x mécanismes SDD_Agents
#
# SSoT machine de la portabilité multi-harnais. Consommée par harness_build.py
# pour compiler `.sdda/` vers les façades (`.claude/`, `.codex/`, `.gemini/`)
# et pour imprimer le RAPPORT D'IMPACT obligatoire à chaque build : ce que
# chaque harnais perd, et par quoi c'est remplacé.
#
# Valeurs : native | partial | emulated | ci_fallback | unsupported
#   native      = fourni par le harnais lui-même
#   partial     = fourni par le harnais pour une PARTIE seulement : le rapport
#                 d'impact nomme, hook par hook, ce qui est câblé et pourquoi le
#                 reste ne l'est pas (runtime_hooks uniquement)
#   emulated    = dégradation contrôlée : une consigne écrite remplace le
#                 mécanisme (ex. `@`-ref réécrite en « Read ce fichier »)
#   ci_fallback = reporté au CI-time / aux scripts déterministes
#   unsupported = absent, aucune émulation prévue — DOIT être documenté dans le rapport
#
# Chaque valeur des harnais non-Claude est tirée de leur documentation
# OFFICIELLE (URL en commentaire). Ce que la doc ne dit pas n'est pas déclaré
# `native` : c'est dit dans `impact`, et marqué « non vérifié » dans
# docs/MULTI-HARNESS.md.
#
# protection_level :
#   A = référence (toutes les gates s'appliquent au runtime)
#   B = émulations, gates déplacées vers le wrapper + CI
#   C = mono-agent seulement, ou combo non éprouvé par un run de conformance

schema: sdda.capabilities/v1
status: design-phase-0

# ---------------------------------------------------------------------------
# Les mécanismes dont SDD_Agents dépend
# ---------------------------------------------------------------------------
mechanisms:
  subagent_spawn:
    description: sous-agents isolés + parallélisme borné (MaxParallel)
    why_it_matters: |
      Les phases 2, 3, 4, 6 et 7B sont parallèles par conception. Sans spawn
      isolé, elles se sérialisent : le pipeline reste correct mais la durée de
      construction se multiplie. Ce n'est PAS un mécanisme de correction — sa
      dégradation coûte du temps, pas de la qualité.

  runtime_hooks:
    description: hooks bloquants avant/après appel d'outil
    why_it_matters: |
      C'est le mécanisme le plus critique de SDD_Agents. Les gates G3, G4, G7 et
      les invariants `tool-gate-before-agent-wiring`, `retrieval-gate-before-agent`,
      `prompts-are-files` sont appliqués par des hooks. Sans hooks au runtime, ils
      doivent TOUS basculer en ci_fallback — sinon le framework prétend garantir
      ce qu'il n'applique plus. C'est la ligne rouge du rapport d'impact.

  deterministic_python:
    description: scripts 0-token (validateurs, ir_compiler, eval_runner, gates)
    why_it_matters: |
      Le cœur de SDD_Agents. Indépendant du harnais par construction : tout ce
      qui compte vraiment (P4) tourne ici. C'est ce qui rend la portabilité
      réaliste — un harnais dégradé perd du confort, pas la validation.

  slash_commands:
    description: les 10 commandes d'orchestration

  skills_autotrigger:
    description: skills à déclenchement contextuel

  at_include:
    description: lazy-load `@file` dans les prompts et la mémoire

  mcp:
    description: Model Context Protocol
    why_it_matters: |
      Double rôle en agentic : le harnais peut consommer du MCP pour CONSTRUIRE,
      et le produit généré consomme du MCP pour FONCTIONNER. Le second ne dépend
      PAS du harnais — un produit MCP construit sous Codex tourne à l'identique.

  structured_output:
    description: sorties structurées fiables (JSON Schema)
    why_it_matters: |
      Propre à SDD_Agents, sans équivalent SDD_Pro : les rapports d'eval, les
      verdicts de gate et les contrats compilés sont du JSON. Un harnais qui rend
      du JSON approximatif oblige à un parsing défensif et à une passe de
      réparation — coût réel, et source de faux verts.

# ---------------------------------------------------------------------------
# Les harnais
# ---------------------------------------------------------------------------
harnesses:

  claude-code:
    protection_level: A
    status: reference
    mechanisms:
      subagent_spawn: native          # tool Agent/Task
      runtime_hooks: native           # PreToolUse / SubagentStop — .claude/settings.json
      deterministic_python: native
      slash_commands: native          # .claude/commands/*.md
      skills_autotrigger: native
      at_include: native
      mcp: native
      structured_output: native
    memory_file: CLAUDE.md
    # Tier déclaré par l'agent -> SÉLECTEUR DE MODÈLE DU HARNAIS.
    #
    # Distinct de `tier_map` des providers, et volontairement : `.sdda/providers/*.yaml`
    # résout un tier vers un *identifiant d'API* pour les modèles du PRODUIT, quand
    # ce bloc résout le même tier vers le mot que le HARNAIS accepte dans le
    # frontmatter d'un sous-agent (ARCHITECTURE §6 : harness, build models et
    # runtime models sont trois choses indépendantes).
    #
    # Sans ce bloc, `harness_build` n'émettait que `model_tier:`, que Claude Code
    # ne lit pas : les 22 agents héritaient tous du modèle du fil parent. Le
    # mécanisme de tiers existait, était testé, borné par agent-bounds.yaml — et
    # ne changeait aucun appel. Un `fast` facturé au prix d'un `deep` ne se voit
    # sur aucune gate, seulement sur la facture.
    tier_models:
      deep: opus
      balanced: sonnet
      fast: haiku
    notes: |
      Harnais de référence. Toutes les gates s'appliquent au runtime. Les mesures
      de coût et de latence du pipeline de construction sont calibrées ici.

  codex:
    protection_level: B
    status: planned
    # Sources (developers.openai.com/codex/*, qui redirige en 308 vers
    # learn.chatgpt.com/docs/*) : agents-md, subagents, build-skills, hooks,
    # custom-prompts, models ; grammaire apply_patch : github.com/openai/codex.
    mechanisms:
      subagent_spawn: native          # .codex/agents/*.toml (name, description, developer_instructions)
      runtime_hooks: partial          # .codex/hooks.json : PreToolUse apply_patch câblé (zones protégées)
      deterministic_python: native
      slash_commands: native          # skills .agents/skills/*/SKILL.md, invoquées par `$nom` ou /skills
      skills_autotrigger: native      # les skills se déclenchent aussi implicitement
      at_include: unsupported         # repli : consigne « Read X avant de poursuivre »
      mcp: native
      structured_output: native
    memory_file: AGENTS.md
    # Identifiants de la page officielle des modèles Codex (`codex -m …`).
    tier_models:
      deep: gpt-6-astra
      balanced: gpt-6-sol
      fast: gpt-6-luna
    impact: |
      EXPÉRIMENTAL : compilable, jamais validé par un run de conformance.
      Codex CLI lit `AGENTS.md` à la racine (32 KiB au plus, project_doc_max_bytes) :
      harness_build y écrit un pointeur vers `.codex/AGENTS.md`. Les custom prompts
      `.codex/prompts/` n'étaient lus par personne (Codex ne lit que ~/.codex/prompts,
      et les déprécie) : les commandes sont des skills `.agents/skills/`.
      HOOKS : seul `preflight_ownership` est câblé, sur `apply_patch` — il refuse au
      runtime les écritures dans les zones protégées (rapports de gate, baselines,
      audit), quel que soit l'auteur. Le payload Codex ne nomme ni l'agent auteur
      d'un appel, ni l'agent que lance `spawn_agent` : la matrice d'ownership par
      agent, les lectures interdites, le shell et les gates de spawn restent au CI.
      `SubagentStop` existe, mais ni l'agent qui s'arrête ni l'effet du code 2 n'y
      sont documentés. Les hooks de projet ne se chargent que si `.codex/` est
      approuvé (/hooks). Commande POSIX : non vérifié sous Windows.
      `sandbox_mode` (read-only | workspace-write) est la seule borne d'écriture par
      agent ; elle est plus grossière que la matrice. Caractères permis dans le
      `name` d'un agent : non documentés (les exemples officiels sont en snake_case).
      GARDE : tout le noyau déterministe, donc toute la validation réelle.

  gemini-cli:
    protection_level: B
    status: planned
    # Sources : geminicli.com/docs (cli/custom-commands, cli/gemini-md, core/subagents,
    # hooks, hooks/reference, reference/tools, cli/model) et github.com/google-gemini/gemini-cli.
    mechanisms:
      subagent_spawn: native          # .gemini/agents/*.md, exposés comme un outil du même nom
      runtime_hooks: partial          # .gemini/settings.json : BeforeTool write_file|replace + outils d'agents
      deterministic_python: native
      slash_commands: native          # .gemini/commands/*.toml
      skills_autotrigger: emulated
      at_include: emulated            # corps réécrits ; le fichier mémoire, lui, est importé (@./…)
      mcp: native
      structured_output: emulated     # à mesurer au premier run de conformance
    memory_file: GEMINI.md
    # Modèles de la page officielle « Model selection » de Gemini CLI. Deux
    # familles seulement (pro, flash) : `balanced` prend pro — descendre un agent
    # balanced au tier rapide serait relâcher un plancher sans l'avoir mesuré.
    tier_models:
      deep: gemini-3-pro-preview
      balanced: gemini-3-pro-preview
      fast: gemini-3-flash-preview
    impact: |
      EXPÉRIMENTAL : compilable, jamais validé par un run de conformance.
      Gemini CLI lit `GEMINI.md` à la racine : harness_build y écrit un pointeur
      qui IMPORTE `.gemini/GEMINI.md` (@./.gemini/GEMINI.md).
      HOOKS (BeforeTool, code 2 = blocage) : `preflight_ownership` sur
      write_file|replace refuse au runtime les écritures dans les zones protégées,
      quel que soit l'auteur ; les dix hooks de spawn sont câblés sur l'outil qui
      porte le nom de chaque agent. Le déclenchement de BeforeTool sur l'outil d'un
      sous-agent et les paramètres de cet outil ne sont PAS documentés : non
      vérifié par un run. Le payload ne nomme pas l'agent auteur d'un appel : la
      matrice par agent, les lectures interdites et le shell restent au CI. Aucun
      événement de fin de sous-agent : `prompts-are-files` et
      `trace-emitted-per-run` restent au CI. Les hooks de projet sont
      empreintés : chaque changement de commande demande une confirmation.
      Commande POSIX : non vérifié sous Windows.
      `structured_output: emulated` est le point à surveiller : les rapports d'eval
      et les verdicts de gate sont du JSON. À requalifier après mesure — pas avant.

  antigravity:
    protection_level: B
    status: planned
    # Sources : antigravity.google/docs (rules, skills, subagents, hooks,
    # ide/workflows, migration/workflows-to-skills).
    mechanisms:
      subagent_spawn: native          # .agents/agents/*.md, invoke_subagent
      runtime_hooks: ci_fallback      # hooks.json existe, mais payload et codes de sortie non documentés
      deterministic_python: native
      slash_commands: native          # skills .agents/skills/*/SKILL.md, invoquées par /nom
      skills_autotrigger: native
      at_include: emulated
      mcp: native
      structured_output: native
    memory_file: AGENTS.md
    # `model` d'un sous-agent Antigravity : inherit | flash | pro.
    tier_models:
      deep: pro
      balanced: pro
      fast: flash
    impact: |
      EXPÉRIMENTAL : compilable, jamais validé par un run de conformance.
      Façade propre `.agents/` (il partageait `.gemini/`, qu'il ne lit pas).
      Antigravity lit `AGENTS.md` ET `GEMINI.md` à la racine (toujours actifs) et
      `.agents/rules/` : l'architecture y est découpée en règles de 24 000 octets au
      plus, `trigger: model_decision` (59 Ko en `always_on` dépasseraient la limite
      par fichier et le budget de 20 000 tokens des règles actives). Commandes en
      skills `.agents/skills/` — les workflows sont retirés le 1er novembre 2026.
      Sous-agents sans `tools` : la doc ne publie pas les noms d'outils et signale
      qu'un nom erroné peut bloquer l'agent ; les outils autorisés sont écrits dans
      le corps, comme consigne.
      HOOKS : aucun câblé. `.agents/hooks.json` et PreToolUse existent, mais la doc
      ne publie ni les arguments de `toolCall.args` ni l'effet d'un code de sortie
      (le refus passe par un JSON `decision` sur stdout) : un hook qui ne sait pas
      lire le chemin visé serait un enforcer muet. Tout reste au CI.

# ---------------------------------------------------------------------------
# Règle du rapport d'impact
# ---------------------------------------------------------------------------
impact_report_policy: |
  harness_build.py REFUSE de produire une façade sans émettre son rapport
  d'impact. Le rapport nomme, mécanisme par mécanisme, ce que le harnais cible
  ne fait pas nativement et par quoi c'est remplacé.

  Règle dure : un invariant de INVARIANTS.yml dont TOUS les enforcers sont
  `runtime_hooks` sur un harnais où runtime_hooks != native doit apparaître
  dans le rapport sous la mention « appliqué en différé (CI) ». Le prétendre
  appliqué au runtime serait exactement le doc-theater que INVARIANTS.yml
  existe pour empêcher.

  Un harnais ne peut pas être annoncé au niveau A sans un run de conformance
  mesuré. `status: planned` signifie « compilable », jamais « validé ».

  Dit aux utilisateurs (README, MULTI-HARNESS.md, AGENTS.md / GEMINI.md racine) :
  Claude Code est SUPPORTÉ ; un harnais `planned` est EXPÉRIMENTAL, sans gate
  bloquante au runtime.
