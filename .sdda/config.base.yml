# SDD_Agents — Project Config, couche de base
#
# Hiérarchie à 3 couches (le projet gagne, sauf security-down) :
#   1. .sdda/config.base.yml          <- CE FICHIER, défauts du framework
#   2. ~/.sdda/config.team.yml        politique d'équipe / d'organisation
#   3. workspace/stack/STACK.md       ## Project Config, override final
#
# Deep-merge : scalaires remplacés, listes remplacées (pas de concaténation).
#
# PROTECTION SECURITY-DOWN : le projet NE PEUT PAS relâcher ce que la couche
# team a durci sur les clés listées dans `security_down_protected` en fin de
# fichier. Violation -> [CONFIG_SECURITY_DOWNGRADE], bloquant.
#
# Toute clé doit exister dans templates/project-config.schema.json, sinon
# WARN [CONFIG_UNKNOWN_KEY] à la lecture (SDDA_CONFIG_STRICT=1 la rend fatale).

# ═══════════════════════════════════════════════════════════════════════════
# Budget d'EXECUTION du produit généré  (P6 — exigence fonctionnelle)
# ═══════════════════════════════════════════════════════════════════════════
# Ces valeurs n'ont pas de défaut universel sensé : elles dépendent du modèle
# économique du produit. `null` force la MISSION à les déclarer (G0 refuse un
# budget absent). C'est délibéré : un défaut silencieux ici ferait passer des
# architectures économiquement impossibles.
CostPerRunTargetUsd: null
CostPerRunHardCapUsd: null
LatencyP95TargetMs: null
TokenCeilingPerRun: null

# ═══════════════════════════════════════════════════════════════════════════
# Bornes imposées à TOUT agent généré  (P12 — invariant no-unbounded-loop)
# ═══════════════════════════════════════════════════════════════════════════
# Défauts volontairement serrés. Les desserrer est une décision explicite,
# visible dans le diff de STACK.md.
MaxIterations: 12
MaxToolCalls: 25
MaxDelegationDepth: 3
AgentTimeoutSec: 120
OnBoundExceeded: fail-explicit        # fail-explicit | degrade | escalate-human

# ═══════════════════════════════════════════════════════════════════════════
# Budget de CONSTRUCTION (le pipeline SDD_Agents lui-même)
# ═══════════════════════════════════════════════════════════════════════════
MaxCostPerRun: 50.00                  # USD ; 0 = désactivé
BuildLoopMaxCostUsd: 15.00
BuildLoopMaxIter: 3
MaxParallel: 3

# ═══════════════════════════════════════════════════════════════════════════
# Evaluation  (P3 — le non-déterminisme se comptabilise)
# ═══════════════════════════════════════════════════════════════════════════
EvalRuns: 3                           # k runs par item. 1 = dev local, REFUSÉ en CI
EvalRunsCritical: 5                   # pour Criticality: critical
EvalVarianceWarnPct: 15               # écart-type au-delà -> verdict JAUNE
# Items mesurés simultanément DANS un run. C'est le poste qui domine la durée
# murale d'un pipeline : k=3 sur 50 items, répété en G5, G6, PHASE 6 puis G8,
# fait plus d'un millier d'appels au système évalué — des heures, quand les
# agents de construction se comptent en dizaines de minutes.
# L'ordre des résultats est reconstruit avant agrégation : la mesure ne dépend
# pas de l'ordonnanceur (P10). `1` pour un exécuteur qui ne supporte pas les
# appels concurrents.
EvalMaxParallel: 4
EvalSeedPolicy: vary                  # vary | fixed — `fixed` masque la variance,
                                      # réservé au débogage d'un cas précis

# Calibration des juges LLM (P9 — invariant llm-judge-calibrated)
JudgeCalibrationMinKappa: 0.6
JudgeCalibrationMinItems: 50
JudgeAdvisoryFallback: true           # sous le seuil, le juge informe mais ne bloque plus
JudgeMustDifferFromEvaluated: true    # un modèle qui se note mesure sa complaisance

# Datasets
GoldenSetMinItems: 50
HoldoutSetMinItems: 30
CalibrationSetMinItems: 50
AdversarialSetMinItems: 25
HoldoutDisjointCheck: strict          # strict | warn
                                      # `warn` autorise l'optimisation contre le jeu
                                      # qui rend le verdict. À n'utiliser qu'en POC.

# Régression (L9)
RegressionTolerancePct: 3
RegressionNoiseSigma: 2.0             # une baisse au-delà de la tolérance mais
                                      # sous N écarts-types de la BASELINE est du
                                      # bruit d'échantillonnage, pas une régression :
                                      # WARN [REGRESSION_WITHIN_NOISE], jamais rouge.
                                      # 0 = ignorer l'écart-type (comportement strict)
BaselinePromotionPolicy: explicit     # explicit | auto
                                      # `auto` rend la dérive lente invisible

# ═══════════════════════════════════════════════════════════════════════════
# Seuils de la RETRIEVAL GATE (G4)
# ═══════════════════════════════════════════════════════════════════════════
# Auto-skip si `## Active RAG Pattern` = none.
RetrievalRecallAtK: 0.80
RetrievalK: 8
RetrievalNdcgMin: 0.70
RetrievalContextPrecisionMin: 0.60
GroundednessMin: 0.85
CitationResolveRateMin: 0.98
RetrievalGoldenMinQueries: 50

# ═══════════════════════════════════════════════════════════════════════════
# Modes des reviewers : off | manual | full
# ═══════════════════════════════════════════════════════════════════════════
SpecComplianceMode: full
AgentSafetyMode: full
CostLatencyMode: full
OrchestrationReviewMode: full
RagQualityMode: full                  # auto-skip si pas de RAG
AdversarialMode: full

# AgentSafetyMode: off est REFUSÉ sur un run de production — SDDA_ENV=production
# ou ci, ou CI=true, la même lecture que `/sdda-full --no-review` — :
# validate_safety_gate.py émet [SAFETY_REVIEW_DISABLED_IN_PRODUCTION] et exige
# le rapport de review-safety. La raison est simple : la surface d'attaque d'un
# système agentic, c'est chaque document qu'il récupère. Débrayer la revue
# sécurité, c'est livrer sans avoir regardé.
AgentSafetyRequiredInProduction: true

# L'étagement de la revue (A spec-compliance seul ; B safety ∥ cost ∥
# orchestration ∥ rag ; C adversarial sur système vivant) n'est pas une clé :
# c'est le déroulé de /sdda-review, et `AuditorBatchMode` n'était lu par personne.

# Seuils de blocage : info | minor | moderate | serious | critical
# Seuls les reviewers dont un script applique le seuil en portent un :
# spec-compliance (review-spec), agent-safety et orchestration
# (validate_safety_gate.py), adversarial (review-adversarial). Les rapports de
# review-cost et review-rag sont lus en revue, sans seuil de blocage propre.
SpecComplianceFailOn: serious
AgentSafetyFailOn: critical
OrchestrationFailOn: serious
AdversarialFailOn: critical

# ═══════════════════════════════════════════════════════════════════════════
# Contournements — il n'existe AUCUN mode par gate
# ═══════════════════════════════════════════════════════════════════════════
# Les gates n'ont pas de clé `strict | warn | off` : un contournement est une
# env var nominative (SDDA_BYPASS_BUDGET_ESTIMATE, SDDA_BYPASS_TOOL_GATE,
# SDDA_BYPASS_RETRIEVAL_GATE) avec SDDA_BYPASS_REASON, ou `--force` sur les
# gates jaunes — chacun journalisé dans workspace/.sys/.audit/bypasses.jsonl
# (R5). G0, G1, G5, G6 et G8 n'en ont aucun.
# Cumul — hérité de SDD_Pro (preflight_force_cumul) : au-delà de ce nombre sur
# un même run -> [FORCE_CUMUL_REJECTED], sauf SDDA_ALLOW_FORCE=1, lui-même tracé.
MaxBypassesPerRun: 1

# ═══════════════════════════════════════════════════════════════════════════
# Granularité de la spécification
# ═══════════════════════════════════════════════════════════════════════════
CapGranularityTarget: 4
CapGranularityWarnAt: 8
CapGranularityHardCap: 15

# Simplicité topologique (P7)
MaxAgentsWarnAt: 4                    # au-delà, justification renforcée exigée
# L'imbrication de patterns est bornée à 2 par ORCHESTRATION-PATTERNS.md §3 et
# la section « Alternative plus simple écartée » est exigée par validate_topology
# — inconditionnellement. Ni l'un ni l'autre n'est un réglage : `MaxNestingDepth`
# et `TopologyJustificationRequired` n'étaient lus par personne.

# ═══════════════════════════════════════════════════════════════════════════
# Prompts
# ═══════════════════════════════════════════════════════════════════════════
PromptMaxTokens: 4000                 # au-delà, dev-prompt refuse : un prompt long dilue
# « Aucun prompt inline » (P1, lint_prompts + postflight_no_inline_prompt) et
# « le hash du prompt est épinglé » (P10, eval_pinning) sont des INVARIANTS,
# pas des clés : `PromptInlineForbidden` et `PromptHashPinning` ne pouvaient
# être mis à `false` par personne — ils ne sont donc plus déclarés ici.

# ═══════════════════════════════════════════════════════════════════════════
# Observabilité
# ═══════════════════════════════════════════════════════════════════════════
TraceLevel: full                      # off | errors-only | sampled | full
TraceSampleRate: 1.0
TracePIIPolicy: redact                # redact | hash | raw
CostTrackingEnabled: true
TraceRequiredPerRun: true             # invariant trace-emitted-per-run

# ═══════════════════════════════════════════════════════════════════════════
# Inférence locale (RuntimeProvider: local-ollama)
# ═══════════════════════════════════════════════════════════════════════════
# Le prix par token est nul, mais le coût ne l'est pas. Sans ces clés,
# `estimate_budget.py` verrait un budget gratuit et la TOPOLOGY GATE laisserait
# passer n'importe quelle topologie — un faux vert budgétaire, exactement ce que
# P6 refuse. Chaque appel est chiffré en tokens / débit x tarif horaire.
# 0 = ne pas modéliser : coût local à zéro ASSUMÉ, et le rapport de budget le
# dit ([BUDGET_LOCAL_COMPUTE_UNMODELLED], WARN).
LocalComputeCostPerHourUsd: 0.0
LocalComputeThroughputTokensPerSec: 0  # tokens/s (entrée + sortie) ; 0 = inconnu

# ═══════════════════════════════════════════════════════════════════════════
# Livrable
# ═══════════════════════════════════════════════════════════════════════════
# CE QU'ON INSTALLE à la fin. Jusqu'ici seule la SURFACE était déclarée
# (`## Active Serving Surface`), ce qui laissait la question « et on livre
# quoi ? » sans réponse dans la configuration — donc arbitrée par l'agent, donc
# différemment à chaque run.
#
# La distinction qui compte : la SURFACE est par où l'on entre (CLI, HTTP,
# MCP, lot), le LIVRABLE est ce qu'on installe (un service, un exécutable, une
# bibliothèque, une image). Les deux sont indépendants — un même `RunService`
# s'expose en HTTP ou en lot, et se livre en conteneur ou en exécutable.
#
# Ces clés vivent dans `## Project Config` et non dans une section `## Active *`
# parce qu'elles relèvent de la POLITIQUE : une équipe doit pouvoir interdire
# `ApiAuthMode: none` ou `ApiContractFirst: false` en production. Les clés de
# section `## Active *` (ChunkSize, DbAgentRole, TraceLevel…) sont du réglage
# par projet et se lisent par `read_stack_section_kv`.
DeliverableType: cli-exe              # backend-api | cli-exe | batch-job |
                                      # library | container | mcp-server
                                      #
                                      # LE DÉFAUT EST `cli-exe`, DANS LES QUATRE
                                      # LANGAGES. Un système agentic se livre
                                      # d'abord comme un programme qu'on lance :
                                      # une entrée, une sortie, un code de
                                      # retour. C'est la forme la moins chère à
                                      # câbler (pas de serveur, pas de session,
                                      # pas d'authentification), et c'est celle
                                      # que le runner d'eval invoque en L4-L7 —
                                      # donc ce qu'on mesure est ce qu'on livre.
                                      # Le défaut désigne aussi ce que le
                                      # framework sait livrer AUJOURD'HUI : la
                                      # combo C1 est CLI-first. Un défaut qui
                                      # pointe une fiche non validée fait échouer
                                      # chaque nouveau projet au premier
                                      # preflight, et on apprend à couper le
                                      # preflight.
                                      #
                                      # `backend-api` N'EST PAS UNE VARIANTE DE
                                      # PRÉSENTATION, c'est un changement de
                                      # nature du livrable. Le moteur agentic
                                      # cesse d'être un programme que quelqu'un
                                      # lance et devient un SERVICE qu'une autre
                                      # application appelle : elle lui envoie une
                                      # requête, il exécute la MISSION, il rend
                                      # la réponse et les événements. On le
                                      # choisit quand l'appelant est un logiciel
                                      # (un front, un back métier, un
                                      # ordonnanceur), jamais pour « faire plus
                                      # propre ».
                                      #
                                      # Ce que ce choix rend OBLIGATOIRE, et qui
                                      # n'existe pas en `cli-exe` :
                                      #   - `ApiFramework` != none, cohérent avec
                                      #     le langage actif ;
                                      #   - `ApiAuthMode` != none dès qu'on
                                      #     touche des données : l'identité de
                                      #     l'appelant entre par le transport, et
                                      #     tout le filtrage à la source en
                                      #     dépend ;
                                      #   - un contrat PUBLIC : l'OpenAPI est
                                      #     dérivé de l'IR et confronté à lui
                                      #     (`ApiContractFirst`), parce qu'un
                                      #     appelant qu'on ne contrôle pas ne se
                                      #     corrige pas après coup.
                                      # La CLI reste générée même alors : elle
                                      # porte le smoke et les evals.

ApiFramework: none                    # none (si DeliverableType != backend-api)
                                      # Python  : fastapi | django-ninja | flask
                                      # .NET    : aspnet-minimal | aspnet-mvc
                                      # Java    : spring-boot
                                      # Node    : express | nestjs
                                      # DOIT être cohérent avec le langage
                                      # actif -> [PACKAGING_LANG_MISMATCH]

                                      # L'architecture INTERNE de la coquille n'est
                                      # pas une clé scalaire : c'est une FICHE,
                                      # `## Active Architecture Pattern` de STACK.md
                                      # (archi/mvc.md par défaut, ddd, microservice),
                                      # lue par dev-backend et dev-api. Sans ce
                                      # choix, chaque `dev-*` imposait la sienne et
                                      # le projet en portait trois.

ApiContractFirst: true                # l'OpenAPI est dérivé des schémas de l'IR
                                      # et vérifié contre eux (API GATE, G6.5).
                                      # `false` : l'API peut diverger de la spec
                                      # — exige un ADR.

ApiAuthMode: none                     # none | api-key | oauth2 | azure-ad | mtls
                                      # L'identité de l'appelant entre par là
                                      # (dev-api STEP 3) : `none` n'est
                                      # acceptable qu'en POC ou derrière une
                                      # passerelle qui l'établit déjà.

# `ServingLocalPort`, `StreamingEnabled` et `HumanInTheLoopEnabled` ne sont PAS
# ici : ils vivent dans `## Active Serving Surface` et `ir_compiler.py` les y
# lit. Les dupliquer donnerait deux sources de vérité pour la même valeur, et
# c'est toujours celle que personne ne relit qui finit par gouverner.

# La reprise (`/sdda-full {n} --resume`, lignée `resumedFrom`, identifiants
# réutilisés à la granularité de l'item) est le comportement de sdda_state, pas
# un réglage : `CheckpointMode`, `ResumeReusesIdentifiers` et
# `PreserveHumanEdits` n'étaient lus par personne, et ne sont plus déclarés.

# ═══════════════════════════════════════════════════════════════════════════
# Combos de stack
# ═══════════════════════════════════════════════════════════════════════════
StackComboCheck: strict               # strict | warn | off
                                      # strict : une combinaison absente de
                                      # registry/compatibility.matrix.json
                                      # (combos[], signature comboSignatureFields)
                                      # refuse le spawn -> [STACK_COMBO_UNLISTED].
                                      # warn : le dit. off : ne regarde pas — et
                                      # exige un ADR (adr-requirements.yml).
                                      # Lu par preflight_stack_combo.
                                      # Bypass audit-loggué : SDDA_ALLOW_UNTESTED_COMBO=1

# ═══════════════════════════════════════════════════════════════════════════
# Clés protégées contre le relâchement par la couche projet
# ═══════════════════════════════════════════════════════════════════════════
# Si la couche team les a durcies, le projet peut durcir davantage mais
# jamais relâcher. Violation -> [CONFIG_SECURITY_DOWNGRADE].
# Le sens de « plus dur » est défini clé par clé dans layered_config.is_downgrade
# — pour ApiAuthMode : none < api-key < oauth2 = azure-ad = mtls.
security_down_protected:
  - ApiAuthMode
  - ApiContractFirst
  - AgentSafetyFailOn
  - AgentSafetyMode
  - AgentSafetyRequiredInProduction
  - AdversarialFailOn
  - EvalRuns
  - HoldoutDisjointCheck
  - GroundednessMin
  - RetrievalRecallAtK
  - CitationResolveRateMin
  - JudgeCalibrationMinKappa
  - MaxBypassesPerRun
