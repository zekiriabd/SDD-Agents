  CAPs             : {C} ({K} critical) · {A} AC mesurables · {J} juges LLM          G1 🟢
  Topologie        : {rootPattern} · {N} agents · {T} outils · {R} retrievers        G2 {🟢|🟡 assumé}
  Budget estimé    : ${est}/run (cible ${target}, cap ${cap}) · p95 {ms} ms

BUILD (phases 3-5)
