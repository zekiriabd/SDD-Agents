# CI minimale de SDD_Agents — le dispositif anti-pourrissement, exécuté à chaque
# push et pull request. Aucune étape n'appelle un LLM ni le réseau (PHILOSOPHY
# P4) : stdlib + pytest, rien d'autre.
#
# Ce que chaque étape ferme :
#   framework_smoke       parité agents/bornes, invariants/enforcers, classes
#                         d'erreur citées vs émises, digests, références, catalogue
#   harness_build --check les façades .claude/ .codex/ .gemini/ sont bien
#                         compilées depuis .sdda/ — une édition à la main échoue
#   sync_error_registry   le registre [CLASS] correspond aux émetteurs réels
#   sync_digests          les tranches de taxonomie par agent sont à jour
#   pytest                la couche déterministe
#
# Les actions sont épinglées par SHA de commit (le tag en commentaire) : un tag
# se déplace, un SHA non. Dependabot (.github/dependabot.yml) propose les mises
# à jour.
#
# Matrice : Linux sur la version minimale (3.11) et une récente, Windows sur la
# récente — le framework se développe sous Windows et les fins de ligne
# (hashing normalisé CRLF/BOM) doivent tenir sur les deux.

name: ci

on:
  push:
    branches: ["main", "next"]
  pull_request:

permissions:
  contents: read

# Mode strict des hooks : un hook qui plante refuse au lieu de laisser passer.
# Posé ici avant d'exister partout — sans effet tant qu'aucun hook ne le lit.
env:
  SDDA_HOOKS_STRICT: "1"

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      # Le lanceur, pas les chemins à cinq segments : la CI doit exercer la
      # forme que les prompts écrivent. Si `python .sdda/sdda.py` cassait, toutes
      # les fiches d'agents casseraient avec lui, et une CI verte le cacherait.
      - name: framework_smoke
        run: python .sdda/sdda.py framework-smoke

      - name: harness_build --check
        run: python .sdda/sdda.py harness-build --check

      - name: sync_error_registry --check
        run: python .sdda/sdda.py sync-error-registry --check

      - name: sync_digests --check
        run: python .sdda/sdda.py sync-digests --check

      - name: sync_counters --check
        run: python .sdda/sdda.py sync-counters --check

      - name: pytest
        run: python -m pytest .sdda/python/tests -q -p no:cacheprovider
